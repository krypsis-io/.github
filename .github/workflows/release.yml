name: Release

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version for semantic-release"
        type: string
        default: "24"
      generate-sbom:
        description: "Generate and submit SBOM"
        type: boolean
        default: true
    secrets:
      APP_ID:
        required: false
        description: "GitHub App Client ID for generating a token that triggers downstream workflows (optional, falls back to GITHUB_TOKEN)"
      APP_PRIVATE_KEY:
        required: false
        description: "GitHub App private key (optional, falls back to GITHUB_TOKEN)"
    outputs:
      new-release-published:
        description: "Whether a new release was published"
        value: ${{ jobs.release.outputs.new-release-published }}
      new-release-version:
        description: "The new release version (without v prefix)"
        value: ${{ jobs.release.outputs.new-release-version }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Check for GitHub App credentials
        id: app-check
        env:
          HAS_APP_ID: ${{ secrets.APP_ID }}
          HAS_APP_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$HAS_APP_ID" ] && [ -n "$HAS_APP_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.app-check.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Submit SBOM to dependency graph
        if: inputs.generate-sbom && github.event.repository.visibility == 'public'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: github
          output: dependency-results.sbom.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      # The semantic-release toolchain is pinned in semantic-release/package-lock.json in this
      # repo (sha512 integrity per package, Renovate-managed). Check this repo out at the exact
      # commit the caller's workflow resolved to, so the workflow and the lockfile always match.
      # Runs after the SBOM step so the tooling's node_modules are not scanned as project deps.
      - name: Checkout semantic-release toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krypsis-io/.github
          ref: ${{ github.job_workflow_sha }}
          path: .semantic-release-tooling
          sparse-checkout: semantic-release
          sparse-checkout-cone-mode: true

      - name: Install semantic-release
        working-directory: .semantic-release-tooling/semantic-release
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Get latest tag before release
        id: before
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          semantic-release
          git fetch --tags
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$NEW_TAG" != "${{ steps.before.outputs.tag }}" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi
