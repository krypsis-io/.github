name: Renovate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run Renovate in dry-run mode (false or full)"
        type: choice
        options:
          - "false"
          - full
        default: "false"
      log-level:
        description: "Log level"
        type: choice
        options:
          - info
          - debug
        default: info

jobs:
  renovate:
    if: github.repository != 'krypsis-io/.github'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect mode
        id: mode
        run: |
          if [[ "${{ github.repository }}" == */.github ]]; then
            echo "autodiscover=true" >> "$GITHUB_OUTPUT"
            echo "repositories=" >> "$GITHUB_OUTPUT"
          else
            echo "autodiscover=false" >> "$GITHUB_OUTPUT"
            echo "repositories=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dry-run || 'false' }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_AUTODISCOVER: ${{ steps.mode.outputs.autodiscover }}
          RENOVATE_AUTODISCOVER_FILTER: /^${{ github.repository_owner }}\/(?!\.github$).*/
          RENOVATE_REPOSITORIES: ${{ steps.mode.outputs.repositories }}
